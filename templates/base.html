<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Compartidos esperados{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
  <header class="cabecera">
    <a class="marca" href="{{ url_for('index') }}">Compartidos esperados</a>
    <p class="cabecera-texto">Estimación de cuántas veces se compartirá una noticia de Mashable, a partir de lo que se sabe al publicarla.</p>
  </header>

  <main class="contenido">
    {% block contenido %}{% endblock %}
  </main>

  <footer class="pie">
    <p>Proyecto semestral de Análisis de Negocios, UTFSM. Modelo entrenado con 3.499 noticias de Mashable (2013 y 2014).</p>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
